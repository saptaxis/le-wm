defaults:
  - lewm
  - override data: lunarlander_synthetic_all_clean
  - _self_

# Post-fix v1-equivalent with num_preds=2 (and nothing else different).
# Isolates the effect of multi-step-target prediction on top of the bug fix,
# WITHOUT the v2 dedicated z_kin block. Same data (12 clean datasets),
# same aux loss (linear, full z, lambda=0.2), same history_size=3.
#
# For comparison:
#   - synthetic-all-clean-fs10-aux: same but num_preds=1
#   - synthetic-all-clean-fs10-zkin16-np2: v2 — adds kin_block=16 on top of np=2

output_model_name: lewm_lunarlander_synthetic_all_clean_fs10_aux_np2
subdir: ""
run_dir: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/lewm-runs/synthetic-all-clean-fs10-aux-np2

wm:
  action_dim: 2
  num_preds: 2
  aux_loss:
    enabled: true
    lambda: 0.2
    state_dim: 6
    head_type: linear

wandb:
  enabled: False
