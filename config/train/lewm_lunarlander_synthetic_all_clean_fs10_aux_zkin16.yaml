defaults:
  - lewm
  - override data: lunarlander_synthetic_all_clean
  - _self_

# Post-fix isolation test: v1-equivalent + dedicated z_kin block (kin_block=16).
# num_preds stays at 1 (same as v1). Tests the Q9 question in e5-06: when aux
# supervision can only read z[:, :16], does the encoder learn to route state
# into those reserved dims, or does the predictor continue to do the routing?
#
# Comparison peers (all post-fix):
#   synthetic-all-clean-fs10-aux       : kin_block unset (=192), num_preds=1  (v1-equiv)
#   synthetic-all-clean-fs10-aux-zkin16: kin_block=16,           num_preds=1  (THIS run)
#   synthetic-all-clean-fs10-aux-np2   : kin_block unset,         num_preds=2 (np=2 isolated)
#   synthetic-all-clean-fs10-zkin16-np2: kin_block=16,           num_preds=2  (v2 combined, archived broken)

output_model_name: lewm_lunarlander_synthetic_all_clean_fs10_aux_zkin16
subdir: ""
run_dir: /media/hdd1/physics-priors-latent-space/lunar-lander-networks/lewm-runs/synthetic-all-clean-fs10-aux-zkin16

wm:
  action_dim: 2
  aux_loss:
    enabled: true
    lambda: 0.2
    state_dim: 6
    head_type: linear
    kin_block: 16

wandb:
  enabled: False
